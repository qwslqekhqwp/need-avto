<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Need-Авто — варианты сайта</title>
<meta name="robots" content="noindex">
<link rel="icon" href="assets/icon-red.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Montserrat:wght@800&family=Russo+One&family=Unbounded:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0B0B;--card:#151515;--line:#262626;--text:#F2F2F2;--muted:#8C8C8C;--red:#E10600;--yellow:#FFC400}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:56px 16px}
header{text-align:center;margin-bottom:48px}
header img{width:min(320px,80vw);margin:0 auto 24px}
header p{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,460px));gap:24px;width:100%;justify-content:center}
.card{display:block;background:var(--card);border:1px solid var(--line);color:inherit;text-decoration:none;transition:transform .25s,border-color .25s}
.card:hover{transform:translateY(-4px)}
.card.red:hover{border-color:var(--red)}
.card.yellow:hover{border-color:var(--yellow)}
.preview{height:220px;position:relative;overflow:hidden;padding:28px}
.red .preview{background:#0E0E0E}
.red .preview::before{content:"";position:absolute;top:-20%;right:-18%;width:46%;height:140%;background:var(--red);transform:skewX(-14deg)}
.red .preview h2{font-family:'Unbounded',sans-serif;font-weight:800;font-size:26px;line-height:1.05;text-transform:uppercase;position:relative;max-width:70%}
.red .preview h2 em{font-style:normal;color:var(--red)}
.yellow .preview{background:#111;border-top:8px solid;border-image:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,#111 12px 24px) 8}
.yellow .preview::before{content:"";position:absolute;top:0;right:0;bottom:0;width:38%;background:var(--yellow);clip-path:polygon(25% 0,100% 0,100% 100%,0 100%)}
.yellow .preview h2{font-family:'Russo One',sans-serif;font-weight:400;font-size:28px;line-height:1.05;text-transform:uppercase;position:relative;max-width:70%}
.yellow .preview h2 mark{background:var(--yellow);color:#111;padding:0 .12em}
.chip{position:absolute;left:28px;bottom:28px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:10px 14px}
.red .chip{background:var(--red);color:#fff}
.yellow .chip{background:var(--yellow);color:#111}
.meta{padding:22px 28px 26px;display:flex;justify-content:space-between;align-items:center;gap:16px;border-top:1px solid var(--line)}
.meta b{display:block;font-size:18px}
.meta span{font-size:14px;color:var(--muted)}
.dots{display:flex;gap:6px}
.dots i{width:18px;height:18px;border-radius:50%;border:1px solid #333}
.arrow{font-size:22px}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <img src="assets/logo-red.svg" alt="Need-Авто">
  <p>Два варианта лендинга по цветам уличных плакатов. Выберите, какой открыть.</p>
</header>
<main class="grid">
  <a class="card red" href="red/index.html">
    <div class="preview"><h2>Ремонт авто и <em>шиномонтаж</em> без сюрпризов</h2><span class="chip">Записаться</span></div>
    <div class="meta"><div><b>Вариант A — «Техцентр»</b><span>Чёрный · белый · красный</span></div><div class="dots"><i style="background:#0E0E0E"></i><i style="background:#fff"></i><i style="background:#E10600"></i></div></div>
  </a>
  <a class="card yellow" href="yellow/index.html">
    <div class="preview"><h2>Автосервис и <mark>шиномонтаж</mark></h2><span class="chip">Записаться</span></div>
    <div class="meta"><div><b>Вариант B — «Гараж»</b><span>Чёрный · жёлтый</span></div><div class="dots"><i style="background:#111"></i><i style="background:#FFC400"></i></div></div>
  </a>
</main>
</body>
</html>
